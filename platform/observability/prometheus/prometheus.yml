global:
  scrape_interval: 5s          # SLO를 초 단위로 보려면 15s는 너무 성기다
  evaluation_interval: 5s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # 당신의 서비스
  - job_name: pdp-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pdp-service:8080"]
        labels: { service: pdp }

  # 비교 기준선
  - job_name: legacy
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["legacy:8080"]
        labels: { service: legacy }

  # 의존 서비스 시뮬레이터 (용량·지연·에러의 진실)
  - job_name: dependency-sim
    metrics_path: /metrics
    static_configs:
      - targets: ["dependency-sim:9001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
